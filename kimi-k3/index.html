<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07070e">
<meta name="description" content="Kimi K3 — a pure Web Audio + Canvas visualizer. 6 modes, generative demo tracks, live mic input.">
<title>Kimi K3 — Audio Visualizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2338e1ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2307070e'/%3E%3Crect x='6' y='14' width='4' height='12' rx='2' fill='url(%23g)'/%3E%3Crect x='14' y='6' width='4' height='20' rx='2' fill='url(%23g)'/%3E%3Crect x='22' y='11' width='4' height='15' rx='2' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="viz" aria-label="Audio visualization"></canvas>
<div id="boot" aria-hidden="true"><div class="boot-ring"></div></div>

<!-- ── Top bar ── -->
<header id="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22"><defs><linearGradient id="lg-top" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#38e1ff"/></linearGradient></defs><rect x="4" y="14" width="5" height="14" rx="2.5" fill="url(#lg-top)"/><rect x="13.5" y="5" width="5" height="23" rx="2.5" fill="url(#lg-top)"/><rect x="23" y="10" width="5" height="18" rx="2.5" fill="url(#lg-top)"/></svg>
    </span>
    <span class="brand-text">
      <strong>Kimi&nbsp;K3</strong>
      <em>audio visualizer</em>
    </span>
  </div>

  <button id="status-pill" class="status-pill" type="button" data-state="idle" aria-label="Play or pause">
    <span class="dot" aria-hidden="true"></span>
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <span id="status-text">Ready</span>
  </button>

  <div class="top-actions">
    <button id="btn-fs" class="icon-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</header>

<!-- ── Desktop side panel (controls rendered by ui.js) ── -->
<aside id="panel" aria-label="Visualizer controls">
  <div class="panel-head">
    <h2>Controls</h2>
    <button id="panel-collapse" class="icon-btn" type="button" aria-label="Collapse panel">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <div id="panel-body" class="panel-body"></div>
</aside>
<button id="panel-open" class="icon-btn hidden" type="button" aria-label="Open controls">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
</button>

<!-- ── Mobile bottom sheet (controls rendered by ui.js) ── -->
<section id="sheet" data-sheet="full" aria-label="Visualizer controls">
  <div id="grip" role="button" tabindex="0" aria-label="Expand or collapse controls">
    <span class="grip-bar"></span>
    <span id="grip-hint">Controls</span>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script src="js/tracks.js"></script>
<script src="js/audio.js"></script>
<script src="js/visualizers.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
